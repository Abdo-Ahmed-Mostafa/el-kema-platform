name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Format, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Next generates the global `PageProps`/`LayoutProps`/root-params types
      # into `.next/types`. tsc needs them, so generate before typechecking.
      - name: Generate Next types
        run: pnpm run typegen
        env:
          NEXT_PUBLIC_APP_URL: https://elkema.example
          NEXT_PUBLIC_API_URL: https://api.elkema.example

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_APP_URL: https://elkema.example
          NEXT_PUBLIC_API_URL: https://api.elkema.example

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_APP_URL: https://elkema.example
          NEXT_PUBLIC_API_URL: https://api.elkema.example

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_APP_URL: https://elkema.example
          NEXT_PUBLIC_API_URL: https://api.elkema.example

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
